[versions]
retrofit = "3.0.0"
dagger = "2.57.2"
material_icons = "1.5.0"
pl_ser = "2.0.21"
serialization="1.7.3"
nav_version = "2.9.6"
ksp = "2.0.21-1.0.27"
room_version = "2.8.4"
lifecycle_version = "2.10.0"
agp = "8.6.0"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.8.0"
composeBom = "2024.09.00"
material3 = "1.4.0"
commandiron="1.1.11"
okhttp = "4.12.0"
accompanist = "0.34.0"
workRuntimeKtx = "2.11.2"


[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
gson-converter = {module = "com.squareup.retrofit2:converter-gson", version.ref="retrofit"}
retrofit = {module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit"}
dagger-compiler= {module = "com.google.dagger:dagger-compiler", version.ref = "dagger"}
dagger ={module = "com.google.dagger:dagger", version.ref = "dagger"}
material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "material_icons" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material_icons" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
navigation={module="androidx.navigation:navigation-compose", version.ref="nav_version"}
room-compiler={module="androidx.room:room-compiler", version.ref="room_version"}
room-runtime={module="androidx.room:room-runtime", version.ref="room_version"}
viewmodel={module = "androidx.lifecycle:lifecycle-viewmodel-ktx",  version.ref="lifecycle_version"}
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
commandiron = {module = "com.github.commandiron:WheelPickerCompose", version.ref = "commandiron"}
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }

[plugins]
serialization={id="org.jetbrains.kotlin.plugin.serialization", version.ref="pl_ser"}
ksp = {id="com.google.devtools.ksp", version.ref="ksp"}
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

